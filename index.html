<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>團體點餐系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFF6EC;
    --paper: #FFFFFF;
    --ink: #2B2019;
    --ink-soft: #6B5E54;
    --line: #EADFD0;
    --pink: #E63888;
    --pink-dark: #C21E6C;
    --shadow: 0 2px 0 rgba(43,32,25,0.08);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Noto Sans TC', sans-serif; }
  .mono { font-family: 'DM Mono', monospace; }

  header.top {
    background: var(--ink);
    color: #fff;
    padding: 22px 20px 60px;
    position: relative;
    overflow: hidden;
  }
  header.top::after {
    content: "";
    position: absolute; left: 0; right: 0; bottom: 0; height: 40px;
    background: var(--bg);
    border-radius: 60% 60% 0 0 / 100% 100% 0 0;
  }
  .brandrow { display: flex; align-items: center; gap: 14px; max-width: 1100px; margin: 0 auto; }
  .brandrow h1 { font-size: 22px; margin: 0; font-weight: 900; letter-spacing: .5px; }
  .brandrow p { margin: 2px 0 0; font-size: 12.5px; color: #D9C9BE; }

  main { max-width: 1100px; margin: -30px auto 60px; padding: 0 20px; position: relative; z-index: 2; }

  .panel {
    background: var(--paper);
    border-radius: 18px;
    box-shadow: var(--shadow);
    border: 1px solid var(--line);
  }

  /* Upload Panel */
  .uploadPanel { padding: 18px 20px; margin-bottom: 18px; }
  .uploadPanel h2 { font-size: 15px; margin: 0 0 4px; font-weight: 700; }
  .uploadPanel .hint { font-size: 12.5px; color: var(--ink-soft); margin: 0 0 12px; line-height: 1.6; }
  .uploadRow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .btn {
    border: none; border-radius: 999px; padding: 10px 18px; font-weight: 700; font-size: 13.5px;
    cursor: pointer; font-family: inherit; transition: transform .12s ease, filter .12s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--pink); color: #fff; }
  .btn-primary:hover { filter: brightness(1.06); }
  .btn-outline { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
  .btn-outline:hover { border-color: var(--pink); color: var(--pink-dark); }
  .btn-ghost { background: #F4EAE0; color: var(--ink-soft); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  #fileInput { display: none; }
  .status { font-size: 12.5px; color: var(--ink-soft); margin-top: 8px; min-height: 16px; }
  .status.err { color: #B0322C; }
  .status.ok { color: #2E7D4F; }

  /* Layout */
  .layout { display: flex; gap: 18px; align-items: flex-start; }
  .menuCol { flex: 1; min-width: 0; }
  .cartCol { width: 340px; flex-shrink: 0; position: sticky; top: 16px; }

  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .tab {
    padding: 9px 16px; border-radius: 999px; font-size: 13.5px; font-weight: 700;
    cursor: pointer; border: 1.5px solid transparent; color: #fff;
    box-shadow: var(--shadow); opacity: .55; transition: opacity .2s, transform .2s;
  }
  .tab.active { opacity: 1; transform: translateY(-1px); }

  .catNote { font-size: 12px; color: var(--ink-soft); background: #F4EAE0; padding: 10px 14px; border-radius: 12px; margin-bottom: 14px; line-height: 1.6; }

  .items { display: flex; flex-direction: column; gap: 10px; }
  .item {
    background: var(--paper); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 16px;
  }
  .item-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; cursor: pointer; }
  .item-name { font-weight: 700; font-size: 14.5px; line-height: 1.4; }
  .item-tag { display: inline-block; font-size: 10.5px; font-weight: 900; color: #fff; background: var(--pink); border-radius: 5px; padding: 1px 6px; margin-right: 6px; vertical-align: 2px; }
  .item-note { font-size: 11.5px; color: var(--ink-soft); margin-top: 3px; }
  .item-price { font-weight: 700; font-size: 15px; white-space: nowrap; font-family: 'DM Mono', monospace; }
  .item-price small { font-size: 10.5px; font-weight: 500; color: var(--ink-soft); }

  .item-config { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); display: none; }
  .item-config.open { display: block; }
  .cfg-row { margin-bottom: 10px; }
  .cfg-label { font-size: 12px; font-weight: 700; color: var(--ink-soft); margin-bottom: 6px; }
  .cfg-options { display: flex; gap: 8px; flex-wrap: wrap; }
  .cfg-opt {
    border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 12.5px;
    cursor: pointer; background: #fff; user-select: none;
  }
  .cfg-opt.sel { border-color: var(--pink); background: #FDEAF2; color: var(--pink-dark); font-weight: 700; }
  .qty-row { display: flex; align-items: center; gap: 10px; }
  .qty-btn { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--line); background: #fff; font-size: 16px; cursor: pointer; line-height: 1; }
  .qty-val { font-weight: 700; min-width: 20px; text-align: center; }
  .note-input {
    width: 100%; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 10px; font-size: 12.5px;
    font-family: inherit; resize: none;
  }
  .cfg-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
  .cfg-total { font-weight: 900; font-size: 15px; font-family: 'DM Mono', monospace; }

  /* Cart Panel */
  .cartPanel { padding: 18px; }
  .cartPanel h2 { font-size: 15px; margin: 0 0 12px; font-weight: 900; }
  .nameField { margin-bottom: 14px; }
  .nameField label { font-size: 12px; font-weight: 700; color: var(--ink-soft); display: block; margin-bottom: 5px; }
  .nameField input {
    width: 100%; padding: 9px 12px; border: 1.5px solid var(--line); border-radius: 10px; font-size: 14px; font-family: inherit;
  }
  .nameField input:focus { outline: none; border-color: var(--pink); }
  .cartLine { border-bottom: 1px solid var(--line); padding: 10px 0; font-size: 13px; }
  .cartLine:last-child { border-bottom: none; }
  .cl-top { display: flex; justify-content: space-between; gap: 8px; }
  .cl-name { font-weight: 700; }
  .cl-price { font-family: 'DM Mono', monospace; font-weight: 700; white-space: nowrap; }
  .cl-sub { font-size: 11.5px; color: var(--ink-soft); margin-top: 3px; line-height: 1.5; }
  .cl-remove { background: none; border: none; color: #B0322C; font-size: 11px; cursor: pointer; padding: 0; margin-top: 4px; }
  .cartEmpty { font-size: 12.5px; color: var(--ink-soft); text-align: center; padding: 20px 0; }
  .cartTotal { display: flex; justify-content: space-between; align-items: baseline; padding-top: 12px; margin-top: 6px; border-top: 2px solid var(--ink); }
  .cartTotal .lbl { font-weight: 700; font-size: 13px; }
  .cartTotal .val { font-weight: 900; font-size: 20px; font-family: 'DM Mono', monospace; color: var(--pink-dark); }
  .submitBtn { width: 100%; margin-top: 14px; padding: 13px; font-size: 14.5px; }

  /* Receipt Modal */
  .receiptWrap { margin-top: 16px; padding: 16px; border: 1.5px dashed var(--ink); border-radius: 10px; background: #FFFDF8; display: none; }
  .receiptWrap.show { display: block; }
  .receiptWrap h3 { margin: 0 0 8px; font-size: 13px; font-weight: 900; }
  .receiptWrap .rline { display: flex; justify-content: space-between; font-family: 'DM Mono', monospace; font-size: 12px; padding: 2px 0; }
  .receiptWrap .rsub { font-size: 11px; color: var(--ink-soft); padding-left: 8px; }

  /* Orders Panel */
  .ordersPanel { padding: 20px; margin-top: 20px; }
  .ordersHead { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  .ordersHead h2 { font-size: 16px; margin: 0; font-weight: 900; }
  .grandTotal {
    background: var(--ink); color: #fff; border-radius: 12px; padding: 14px 18px;
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;
  }
  .grandTotal .lbl { font-size: 12.5px; color: #D9C9BE; }
  .grandTotal .val { font-size: 24px; font-weight: 900; font-family: 'DM Mono', monospace; }
  .personCard { border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
  .personCard .p-head { display: flex; justify-content: space-between; align-items: baseline; }
  .personCard .p-name { font-weight: 900; font-size: 14.5px; }
  .personCard .p-time { font-size: 10.5px; color: var(--ink-soft); }
  .personCard .p-total { font-weight: 900; font-family: 'DM Mono', monospace; color: var(--pink-dark); }
  .personCard ul { margin: 8px 0 0; padding-left: 0; list-style: none; font-size: 12.5px; }
  .personCard li { padding: 4px 0; border-top: 1px dotted var(--line); }
  .personCard li:first-child { border-top: none; }
  .li-top { display: flex; justify-content: space-between; }
  .li-sub { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }
  .noOrders { text-align: center; color: var(--ink-soft); font-size: 13px; padding: 30px 0; }

  .summaryBox { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
  .summaryBox h3 { font-size: 12.5px; color: var(--ink-soft); margin: 0 0 8px; font-weight: 700; }
  .summaryGrid { display: flex; flex-wrap: wrap; gap: 8px; }
  .summaryChip { background: #F4EAE0; border-radius: 999px; padding: 6px 12px; font-size: 12px; }
  .summaryChip b { font-family: 'DM Mono', monospace; }

  footer { text-align: center; font-size: 11px; color: var(--ink-soft); padding: 20px 0 30px; }

  /* Modals & Toasts */
  .toast {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%) translateY(-16px);
    background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease;
    z-index: 999; box-shadow: 0 4px 14px rgba(0,0,0,.2); max-width: 90vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .confirm-overlay {
    position: fixed; inset: 0; background: rgba(43,32,25,.45);
    display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px;
  }
  .confirm-overlay.show { display: flex; }
  .confirm-box { background: #fff; border-radius: 16px; padding: 20px; max-width: 320px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,.2); }
  .confirm-box p { margin: 0 0 16px; font-size: 14px; line-height: 1.6; }
  .confirm-actions { display: flex; gap: 10px; justify-content: flex-end; }

  @media (max-width:820px){
    .layout { flex-direction: column; }
    .cartCol { width: 100%; position: static; }
  }
</style>
</head>
<body>

<div id="toast" class="toast"></div>
<div id="confirmOverlay" class="confirm-overlay">
  <div class="confirm-box">
    <p id="confirmMsg"></p>
    <div class="confirm-actions">
      <button class="btn btn-outline" id="confirmCancel">取消</button>
      <button class="btn btn-primary" id="confirmOk">確定</button>
    </div>
  </div>
</div>

<header class="top">
  <div class="brandrow">
    <div>
      <h1>團體線上點餐系統</h1>
      <p id="menuMeta">上傳菜單照片，自動辨識品項與價格，多人一起點餐、自動算總價</p>
    </div>
  </div>
</header>

<main>
  <div class="panel uploadPanel">
    <h2>📋 菜單辨識</h2>
    <p class="hint">目前使用預設菜單（丹丹漢堡）。想換成自己的菜單，直接上傳一張清楚的菜單照片，系統會自動讀出品項名稱與價格。</p>
    <div class="uploadRow">
      <button class="btn btn-primary" id="uploadBtn">上傳新菜單照片</button>
      <button class="btn btn-outline" id="resetMenuBtn">還原範例菜單</button>
      <input type="file" id="fileInput" accept="image/*">
    </div>
    <div class="status" id="uploadStatus"></div>
  </div>

  <div class="layout">
    <div class="menuCol">
      <div class="tabs" id="tabs"></div>
      <div class="catNote" id="catNote"></div>
      <div class="items" id="items"></div>
    </div>

    <div class="cartCol">
      <div class="panel cartPanel">
        <h2>🧾 我的點餐車</h2>
        <div class="nameField">
          <label>你的名字</label>
          <input type="text" id="nameInput" placeholder="輸入名字，方便大家對帳">
        </div>
        <div id="cartLines"></div>
        <div class="cartTotal">
          <span class="lbl">小計</span>
          <span class="val mono" id="cartTotalVal">$0</span>
        </div>
        <button class="btn btn-primary submitBtn" id="submitBtn">送出訂單</button>

        <div class="receiptWrap" id="receiptWrap">
          <h3>✅ 送出成功，你點了：</h3>
          <div id="receiptBody"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="panel ordersPanel">
    <div class="ordersHead">
      <h2>👥 大家的訂單</h2>
      <div>
        <button class="btn btn-ghost" id="refreshBtn">重新整理</button>
        <button class="btn btn-outline" id="clearOrdersBtn">清空所有訂單</button>
      </div>
    </div>
    <div class="grandTotal">
      <span class="lbl">目前總金額（<span id="orderCount">0</span> 筆訂單）</span>
      <span class="val mono" id="grandTotalVal">$0</span>
    </div>
    <div id="ordersList"></div>
    <div class="summaryBox" id="summaryBox" style="display:none;">
      <h3>品項彙總（方便跟店家對單）</h3>
      <div class="summaryGrid" id="summaryGrid"></div>
    </div>
  </div>

  <footer>此系統資料暫存於本裝置，多人點餐紀錄可隨時查看。菜單辨識結果請務必核對價格是否正確。</footer>
</main>

/* LocalStorage Abstraction with Fallback */
const AppStorage = {
  async get(key) {
    if (window.storage && typeof window.storage.get === 'function') {
      try { return await window.storage.get(key, true); } catch(e){}
    }
    const val = localStorage.getItem(key);
    return val ? { value: val } : null;
  },
  async set(key, val) {
    if (window.storage && typeof window.storage.set === 'function') {
      try { return await window.storage.set(key, val, true); } catch(e){}
    }
    localStorage.setItem(key, val);
  }
};

  { id:"milktea", label:"紅茶牛奶", sizes:[{id:"s",label:"小",extra:0},{id:"m",label:"中",extra:5},{id:"l",label:"大",extra:10}] },
  { id:"cornsoup",label:"玉米濃湯", sizes:[{id:"only",label:"",extra:0}] },
  { id:"hotguihua",label:"熱桂花烏龍", sizes:[{id:"only",label:"",extra:0}] },
  { id:"hotamericano",label:"熱美式咖啡", sizes:[{id:"only",label:"",extra:0}] },
];

function normalizeMenu(raw){
  const cats = raw.categories.map((c, ci) => {
    const items = c.items.map((it, ii) => {
      const id = c.key ? `${c.key}-${ii}` : `c${ci}-${ii}`;
      const hasCombo = it.name.includes("+");
      let includes = null;
      if(hasCombo){
        includes = it.name.split("+").map(s=>s.trim());
      }
      const addons = [];
      if(/加購薯條/.test(c.note||"")){
        addons.push({ id:"fries", label:"加購薯條（二選一）", type:"radio",
          options:[
            {id:"none", label:"不加購", price:0},
            {id:"sweet", label:"地瓜薯條", price:26},
            {id:"italian", label:"義式紅醬波浪薯", price:39},
          ]});
      }
      if(/附.{0,10}飲料/.test(c.note||"")){
        addons.push({ id:"drink", label:"飲料選擇（已含在套餐內，可加價升級容量）", type:"drink", options: DRINK_OPTIONS });
      }
      if(it.name.includes("2塊脆皮炸雞")){
        addons.push({ id:"chicken2", label:"炸雞部位（任選）", type:"radio",
          options:[
            {id:"legs", label:"兩隻雞腿", price:0},
            {id:"pieces", label:"兩塊雞塊", price:0},
            {id:"mix", label:"一腿一塊", price:0},
          ]});
      } else if(it.name.includes("脆皮炸雞")){
        addons.push({ id:"chicken1", label:"炸雞部位", type:"radio",
          options:[{id:"leg",label:"雞腿",price:0},{id:"piece",label:"雞塊",price:0}]});
      }
      if(it.name.includes("麵線焿") && hasCombo){
        addons.push({ id:"spicy", label:"升級麻辣麵線焿", type:"checkbox", price:6 });
      }
      if(it.name.includes("鮮脆雞腿堡") && hasCombo){
        addons.push({ id:"flavor", label:"漢堡口味", type:"radio",
          options:[{id:"original",label:"原味",price:0},{id:"spicy",label:"辣味",price:0}]});
      }
      return {
        id, name: it.name, tag: it.tag||null, note: it.note||null,
        price: it.price ?? (it.variants ? it.variants[0].price : 0),
        variants: it.variants||null,
        includes, addons
      };
    });
    return { key:c.key||`cat${ci}`, name:c.name, color:c.color||"#4B2354", note:c.note||"", items };
  });
  return { storeName: raw.storeName || "菜單", categories: cats };
}

function freshCfg(item){
  const cfg = { qty:1, variantIdx:0, checks:{}, radios:{}, drink:null, note:"" };
  (item.addons||[]).forEach(ad=>{
    if(ad.type==="radio") cfg.radios[ad.id] = ad.options[0].id;
    if(ad.type==="drink") cfg.drink = { drinkId: ad.options[0].id, sizeId: ad.options[0].sizes[0].id };
  });
  return cfg;
}

function renderTabs(){
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  MENU.categories.forEach(cat=>{
    const b = document.createElement("div");
    b.className = "tab" + (cat.key===activeCat ? " active":"");
    b.style.background = cat.color;
    b.textContent = cat.name;
    b.onclick = ()=>{ activeCat = cat.key; openItemId=null; renderTabs(); renderItems(); };
    tabs.appendChild(b);
  });
}

function money(n){ return "$" + n; }

function computeUnitPrice(item, cfg){
  let base = item.variants ? item.variants[cfg.variantIdx||0].price : item.price;
  let addonTotal = 0;
  (item.addons||[]).forEach(ad=>{
    if(ad.type==="checkbox" && cfg.checks && cfg.checks[ad.id]) addonTotal += ad.price;
    if(ad.type==="radio" && cfg.radios && cfg.radios[ad.id]){
      const opt = ad.options.find(o=>o.id===cfg.radios[ad.id]);
      if(opt) addonTotal += opt.price;
    }
    if(ad.type==="drink" && cfg.drink){
      const dOpt = ad.options.find(o=>o.id===cfg.drink.drinkId);
      const sz = dOpt ? dOpt.sizes.find(s=>s.id===cfg.drink.sizeId) : null;
      if(sz) addonTotal += sz.extra;
    }
  });
  return base + addonTotal;
}

function describeAddons(item, cfg){
  const lines = [];
  (item.addons||[]).forEach(ad=>{
    if(ad.type==="checkbox" && cfg.checks && cfg.checks[ad.id]){
      lines.push(`${ad.label} (+${ad.price})`);
    } else if(ad.type==="radio" && cfg.radios && cfg.radios[ad.id]){
      const opt = ad.options.find(o=>o.id===cfg.radios[ad.id]);
      if(opt && opt.id!=="none") lines.push(`${ad.label}：${opt.label}${opt.price?` (+${opt.price})`:""}`);
    } else if(ad.type==="drink" && cfg.drink){
      const dOpt = ad.options.find(o=>o.id===cfg.drink.drinkId);
      const sz = dOpt ? dOpt.sizes.find(s=>s.id===cfg.drink.sizeId) : null;
      if(dOpt && sz){
        const sizeLabel = sz.label ? `（${sz.label}）` : "";
        lines.push(`飲料：${dOpt.label}${sizeLabel}${sz.extra?` (+${sz.extra})`:""}`);
      }
    }
  });
  return lines;
}

function renderItems(){
  const wrap = document.getElementById("items");
  const cat = MENU.categories.find(c=>c.key===activeCat);
  document.getElementById("catNote").textContent = cat.note;
  wrap.innerHTML = "";
  cat.items.forEach(item=>{
    if(!itemConfigState[item.id]){
      itemConfigState[item.id] = freshCfg(item);
    }
    const cfg = itemConfigState[item.id];
    const el = document.createElement("div");
    el.className = "item";

    const priceLabel = item.variants
      ? `${money(item.variants[0].price)}<small> 起</small>`
      : money(item.price);

    el.innerHTML = `
      <div class="item-head">
        <div>
          <div class="item-name">${item.tag?`<span class="item-tag">${item.tag}</span>`:""}${item.name}</div>
          ${item.note?`<div class="item-note">${item.note}</div>`:""}
        </div>
        <div class="item-price mono">${priceLabel}</div>
      </div>
      <div class="item-config" id="cfg-${item.id}"></div>
    `;
    el.querySelector(".item-head").onclick = ()=>{
      openItemId = (openItemId===item.id) ? null : item.id;
      renderItems();
    };
    wrap.appendChild(el);

    if(openItemId===item.id){
      renderItemConfig(item, cfg);
    }
  });
}

function renderItemConfig(item, cfg){
  const box = document.getElementById(`cfg-${item.id}`);
  box.classList.add("open");
  let html = "";

  if(item.variants){
    html += `<div class="cfg-row"><div class="cfg-label">選擇規格</div><div class="cfg-options" data-role="variant">`;
    item.variants.forEach((v,i)=>{
      html += `<div class="cfg-opt ${cfg.variantIdx===i?'sel':''}" data-i="${i}">${v.label} $${v.price}</div>`;
    });
    html += `</div></div>`;
  }

  (item.addons||[]).forEach(ad=>{
    if(ad.type==="checkbox"){
      html += `<div class="cfg-row"><div class="cfg-options"><div class="cfg-opt ${cfg.checks[ad.id]?'sel':''}" data-check="${ad.id}">${ad.label} (+${ad.price})</div></div></div>`;
    } else if(ad.type==="radio"){
      html += `<div class="cfg-row"><div class="cfg-label">${ad.label}</div><div class="cfg-options" data-radio="${ad.id}">`;
      ad.options.forEach(o=>{
        html += `<div class="cfg-opt ${cfg.radios[ad.id]===o.id?'sel':''}" data-opt="${o.id}">${o.label}${o.price?` +${o.price}`:""}</div>`;
      });
      html += `</div></div>`;
    } else if(ad.type==="drink"){
      html += `<div class="cfg-row"><div class="cfg-label">${ad.label}</div><div class="cfg-options" data-drink="${ad.id}">`;
      ad.options.forEach(o=>{
        html += `<div class="cfg-opt ${cfg.drink.drinkId===o.id?'sel':''}" data-drinkid="${o.id}">${o.label}</div>`;
      });
      html += `</div>`;
      const chosen = ad.options.find(o=>o.id===cfg.drink.drinkId);
      if(chosen && chosen.sizes.length>1){
        html += `<div class="cfg-label" style="margin-top:8px;">選擇容量</div><div class="cfg-options" data-drinksize="${ad.id}">`;
        chosen.sizes.forEach(s=>{
          html += `<div class="cfg-opt ${cfg.drink.sizeId===s.id?'sel':''}" data-sizeid="${s.id}">${s.label}${s.extra?` +${s.extra}`:""}</div>`;
        });
        html += `</div>`;
      }
      html += `</div>`;
    }
  });

  html += `
    <div class="cfg-row qty-row">
      <div class="cfg-label" style="margin:0;">數量</div>
      <button class="qty-btn" data-act="dec">−</button>
      <span class="qty-val">${cfg.qty}</span>
      <button class="qty-btn" data-act="inc">＋</button>
    </div>
    <div class="cfg-row">
      <div class="cfg-label">備註（如：部位、少冰、去洋蔥…）</div>
      <textarea class="note-input" rows="2" placeholder="選填">${cfg.note}</textarea>
    </div>
    <div class="cfg-foot">
      <div class="cfg-total mono">${money(computeUnitPrice(item,cfg)*cfg.qty)}</div>
      <button class="btn btn-primary" data-act="add">加入購物車</button>
    </div>
  `;
  box.innerHTML = html;

  if(item.variants){
    box.querySelectorAll('[data-role="variant"] .cfg-opt').forEach(elm=>{
      elm.onclick = ()=>{ cfg.variantIdx = parseInt(elm.dataset.i); renderItemConfig(item,cfg); };
    });
  }
  box.querySelectorAll('[data-check]').forEach(elm=>{
    elm.onclick = ()=>{ const id=elm.dataset.check; cfg.checks[id]=!cfg.checks[id]; renderItemConfig(item,cfg); };
  });
  box.querySelectorAll('[data-radio]').forEach(group=>{
    const adId = group.dataset.radio;
    group.querySelectorAll('.cfg-opt').forEach(elm=>{
      elm.onclick = ()=>{ cfg.radios[adId] = elm.dataset.opt; renderItemConfig(item,cfg); };
    });
  });
  box.querySelectorAll('[data-drink] .cfg-opt').forEach(elm=>{
    elm.onclick = ()=>{
      cfg.drink.drinkId = elm.dataset.drinkid;
      const drinkAddon = item.addons.find(a=>a.type==="drink");
      const opt = drinkAddon.options.find(o=>o.id===cfg.drink.drinkId);
      cfg.drink.sizeId = opt.sizes[0].id;
      renderItemConfig(item,cfg);
    };
  });
  box.querySelectorAll('[data-drinksize] .cfg-opt').forEach(elm=>{
    elm.onclick = ()=>{ cfg.drink.sizeId = elm.dataset.sizeid; renderItemConfig(item,cfg); };
  });
  box.querySelector('[data-act="dec"]').onclick = ()=>{ cfg.qty = Math.max(1,cfg.qty-1); renderItemConfig(item,cfg); };
  box.querySelector('[data-act="inc"]').onclick = ()=>{ cfg.qty = Math.min(20,cfg.qty+1); renderItemConfig(item,cfg); };
  box.querySelector('.note-input').oninput = (e)=>{ cfg.note = e.target.value; };
  box.querySelector('[data-act="add"]').onclick = ()=>{
    addToCart(item, cfg);
    itemConfigState[item.id] = freshCfg(item);
    openItemId = null;
    renderItems();
  };
}

function buildComponents(item, cfg){
  const q = cfg.qty;
  const comps = [];

  let chickenSub = null;
  if(cfg.radios.chicken1) chickenSub = cfg.radios.chicken1 === "leg" ? "雞腿" : "雞塊";
  let chicken2Sub = null;
  if(cfg.radios.chicken2){
    chicken2Sub = { legs:"兩隻雞腿", pieces:"兩塊雞塊", mix:"一腿一塊" }[cfg.radios.chicken2];
  }
  let flavorSub = null;
  if(cfg.radios.flavor) flavorSub = cfg.radios.flavor === "spicy" ? "辣味" : "原味";
  const spicyNoodle = !!(cfg.checks && cfg.checks.spicy);

  if(item.includes){
    item.includes.forEach(name=>{
      let sub = null;
      if(name.includes("脆皮炸雞") && chickenSub) sub = chickenSub;
      else if(name.includes("鮮脆雞腿堡") && flavorSub) sub = flavorSub;
      else if(name.includes("麵線焿") && spicyNoodle) sub = "麻辣升級";
      comps.push({ name, qty:q, sub });
    });
  } else {
    const variantLabel = item.variants ? item.variants[cfg.variantIdx].label : null;
    let sub = chicken2Sub || chickenSub || flavorSub || null;
    comps.push({ name: item.name + (variantLabel?`（${variantLabel}）`:""), qty:q, sub });
  }

  const drinkAddon = (item.addons||[]).find(a=>a.type==="drink");
  if(drinkAddon && cfg.drink){
    const dOpt = drinkAddon.options.find(o=>o.id===cfg.drink.drinkId);
    const sz = dOpt.sizes.find(s=>s.id===cfg.drink.sizeId);
    comps.push({ name: dOpt.label, qty:q, sub: sz.label || null });
  }

  const friesAddon = (item.addons||[]).find(a=>a.type==="radio" && a.id==="fries");
  if(friesAddon && cfg.radios.fries && cfg.radios.fries !== "none"){
    const opt = friesAddon.options.find(o=>o.id===cfg.radios.fries);
    comps.push({ name: opt.label, qty:q, sub:null });
  }

  return comps;
}

function addToCart(item, cfg){
  const unit = computeUnitPrice(item, cfg);
  const variantLabel = item.variants ? item.variants[cfg.variantIdx].label : null;
  cart.push({
    name: item.name + (variantLabel ? `（${variantLabel}）` : ""),
    qty: cfg.qty,
    unit,
    lineTotal: unit * cfg.qty,
    includes: item.includes,
    addonLines: describeAddons(item, cfg),
    components: buildComponents(item, cfg),
    note: cfg.note.trim()
  });
  renderCart();
}

function removeFromCart(i){
  cart.splice(i,1);
  renderCart();
}

function renderCart(){
  const wrap = document.getElementById("cartLines");
  if(cart.length===0){
    wrap.innerHTML = `<div class="cartEmpty">還沒有點餐，從左邊菜單挑選品項吧</div>`;
  } else {
    wrap.innerHTML = cart.map((line,i)=>{
      const subParts = [];
      if(line.includes) subParts.push(`內含：${line.includes.join("、")}`);
      if(line.addonLines.length) subParts.push(line.addonLines.join("、"));
      if(line.note) subParts.push(`備註：${line.note}`);
      return `
        <div class="cartLine">
          <div class="cl-top">
            <span class="cl-name">${line.name} ×${line.qty}</span>
            <span class="cl-price mono">${money(line.lineTotal)}</span>
          </div>
          ${subParts.length?`<div class="cl-sub">${subParts.join(' ・ ')}</div>`:""}
          <button class="cl-remove" data-i="${i}">移除</button>
        </div>`;
    }).join("");
    wrap.querySelectorAll(".cl-remove").forEach(b=>{
      b.onclick = ()=> removeFromCart(parseInt(b.dataset.i));
    });
  }
  const total = cart.reduce((s,l)=>s+l.lineTotal,0);
  document.getElementById("cartTotalVal").textContent = money(total);
}

async function submitOrder(){
  const name = document.getElementById("nameInput").value.trim();
  if(!name){ showToast("請先輸入你的名字"); return; }
  if(cart.length===0){ showToast("購物車是空的，先選幾樣餐點吧"); return; }

  const total = cart.reduce((s,l)=>s+l.lineTotal,0);
  const order = {
    id: `${Date.now()}-${Math.random().toString(36).slice(2,7)}`,
    name, time: new Date().toISOString(),
    lines: cart.map(l=>({...l})),
    total
  };

  const btn = document.getElementById("submitBtn");
  btn.disabled = true; btn.textContent = "送出中…";
  try{
    let list = [];
    try{
      const res = await AppStorage.get("dandan_orders");
      if(res && res.value) list = JSON.parse(res.value);
    }catch(e){ list = []; }
    list.push(order);
    await AppStorage.set("dandan_orders", JSON.stringify(list));
    try{ await AppStorage.set("dandan_last_name", name); }catch(e){}

    showReceipt(order);
    cart = [];
    renderCart();
    await loadOrders();
  }catch(e){
    showToast("送出失敗，請稍後再試一次");
    console.error(e);
  }finally{
    btn.disabled = false; btn.textContent = "送出訂單";
  }
}

function showReceipt(order){
  const wrap = document.getElementById("receiptWrap");
  const body = document.getElementById("receiptBody");
  body.innerHTML = order.lines.map(l=>{
    const subParts = [];
    if(l.includes) subParts.push(`內含：${l.includes.join("、")}`);
    if(l.addonLines.length) subParts.push(l.addonLines.join("、"));
    if(l.note) subParts.push(`備註：${l.note}`);
    return `
      <div class="rline"><span>${l.name} ×${l.qty}</span><span>${money(l.lineTotal)}</span></div>
      ${subParts.length?`<div class="rsub">${subParts.join(' ・ ')}</div>`:""}
    `;
  }).join("") + `<div class="rline" style="border-top:1px dashed var(--ink);margin-top:6px;padding-top:6px;"><span>合計</span><span>${money(order.total)}</span></div>`;
  wrap.classList.add("show");
}

async function loadOrders(){
  let list = [];
  try{
    const res = await AppStorage.get("dandan_orders");
    if(res && res.value) list = JSON.parse(res.value);
  }catch(e){ list = []; }

  document.getElementById("orderCount").textContent = list.length;
  const grand = list.reduce((s,o)=>s+o.total,0);
  document.getElementById("grandTotalVal").textContent = money(grand);

  const wrap = document.getElementById("ordersList");
  if(list.length===0){
    wrap.innerHTML = `<div class="noOrders">目前還沒有人送出訂單</div>`;
    document.getElementById("summaryBox").style.display = "none";
    return;
  }

  wrap.innerHTML = list.map(o=>{
    const t = new Date(o.time);
    const timeStr = `${t.getMonth()+1}/${t.getDate()} ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
    return `
      <div class="personCard">
        <div class="p-head">
          <span class="p-name">${escapeHtml(o.name)}</span>
          <span class="p-time">${timeStr}</span>
        </div>
        <ul>
          ${o.lines.map(l=>{
            const subParts = [];
            if(l.includes) subParts.push(`內含：${l.includes.join("、")}`);
            if(l.addonLines && l.addonLines.length) subParts.push(l.addonLines.join("、"));
            if(l.note) subParts.push(`備註：${l.note}`);
            return `<li><div class="li-top"><span>${l.name} ×${l.qty}</span><span class="mono">${money(l.lineTotal)}</span></div>${subParts.length?`<div class="li-sub">${subParts.join(' ・ ')}</div>`:""}</li>`;
          }).join("")}
        </ul>
        <div style="text-align:right;margin-top:8px;">
          <span class="p-total">小計 ${money(o.total)}</span>
        </div>
      </div>
    `;
  }).join("");

  // Aggregate item breakdown
  const counts = {};
  list.forEach(o=> o.lines.forEach(l=>{
    (l.components||[]).forEach(c=>{
      if(!counts[c.name]) counts[c.name] = { total:0, subs:{} };
      counts[c.name].total += c.qty;
      if(c.sub){
        counts[c.name].subs[c.sub] = (counts[c.name].subs[c.sub]||0) + c.qty;
      }
    });
  }));

  const baseName = (n)=> n.replace(/（[^）]*）$/, "");
  const alaCat = MENU.categories.find(c=>c.key==="ala") || MENU.categories.find(c=>/丹點|單點/.test(c.name));
  const drinkCat = MENU.categories.find(c=>c.key==="drink") || MENU.categories.find(c=>/飲品/.test(c.name));
  const alaOrder = {}; (alaCat?alaCat.items:[]).forEach((it,i)=>{ alaOrder[it.name]=i; });
  const drinkOrder = {}; (drinkCat?drinkCat.items:[]).forEach((it,i)=>{ drinkOrder[it.name]=i; });

  const entries = Object.entries(counts).map(([name,info])=>({name,info,base:baseName(name)}));
  const alaGroup = entries.filter(e=> alaOrder[e.base]!==undefined).sort((a,b)=>alaOrder[a.base]-alaOrder[b.base]);
  const drinkGroup = entries.filter(e=> alaOrder[e.base]===undefined && drinkOrder[e.base]!==undefined).sort((a,b)=>drinkOrder[a.base]-drinkOrder[b.base]);
  const otherGroup = entries.filter(e=> alaOrder[e.base]===undefined && drinkOrder[e.base]===undefined).sort((a,b)=>b.info.total-a.info.total);
  const ordered = [...alaGroup, ...otherGroup, ...drinkGroup];

  const summaryGrid = document.getElementById("summaryGrid");
  summaryGrid.innerHTML = ordered
    .map(({name,info})=>{
      const subEntries = Object.entries(info.subs);
      if(subEntries.length===0){
        return `<div class="summaryChip">${name} <b>×${info.total}</b></div>`;
      }
      if(subEntries.length===1 && subEntries[0][1]===info.total){
        return `<div class="summaryChip">${name}（${subEntries[0][0]}） <b>×${info.total}</b></div>`;
      }
      const breakdown = subEntries.map(([s,c])=>`${s}×${c}`).join('、');
      return `<div class="summaryChip">${name} <b>×${info.total}</b>（${breakdown}）</div>`;
    }).join("");
  document.getElementById("summaryBox").style.display = "block";
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let toastTimer = null;
function showToast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove("show"), 2600);
}

function showConfirm(msg){
  return new Promise(resolve=>{
    const overlay = document.getElementById("confirmOverlay");
    document.getElementById("confirmMsg").textContent = msg;
    overlay.classList.add("show");
    const okBtn = document.getElementById("confirmOk");
    const cancelBtn = document.getElementById("confirmCancel");
    const cleanup = (result)=>{
      overlay.classList.remove("show");
      okBtn.onclick = null; cancelBtn.onclick = null;
      resolve(result);
    };
    okBtn.onclick = ()=> cleanup(true);
    cancelBtn.onclick = ()=> cleanup(false);
  });
}

async function clearAllOrders(){
  const ok = await showConfirm("確定要清空「所有人」的訂單嗎？此動作無法復原。");
  if(!ok) return;
  try{
    await AppStorage.set("dandan_orders", JSON.stringify([]));
    await loadOrders();
    showToast("已清空所有訂單");
  }catch(e){ showToast("清空失敗，請再試一次"); }
}

async function extractMenuFromImage(file){
  const statusEl = document.getElementById("uploadStatus");
  statusEl.className = "status";
  statusEl.textContent = "正在讀取圖片…";

  const base64 = await new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=> resolve(r.result.split(",")[1]);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
  const mediaType = file.type || "image/jpeg";

  statusEl.textContent = "正在辨識菜單內容…";

  const systemPrompt = `你是菜單辨識引擎。只能輸出「純JSON」，不能有任何說明文字、不能用markdown code fence。
JSON格式必須是：
{"storeName":"店名","categories":[{"name":"分類名稱","note":"此分類的重要規則，例如是否附飲料、加購規則，20字以內，沒有就空字串","items":[{"name":"品項名稱","price":數字,"tag":"NEW或微辣等標籤，沒有就空字串"}]}]}
規則：
- 套餐若由多個品項組成，name請直接用「品項A+品項B」的格式呈現（用+號連接）。
- price一律是數字。
- 只輸出JSON本身。`;

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: systemPrompt,
        messages: [{
          role: "user",
          content: [
            { type:"image", source:{ type:"base64", media_type: mediaType, data: base64 } },
            { type:"text", text:"請辨識這張菜單圖片，輸出符合格式的JSON。" }
          ]
        }]
      })
    });
    const data = await response.json();
    let text = (data.content||[]).map(b=>b.text||"").join("").trim();
    text = text.replace(/^```json/i,"").replace(/^```/,"").replace(/```$/,"").trim();
    const parsed = JSON.parse(text);
    if(!parsed.categories || !parsed.categories.length) throw new Error("empty");

    MENU = normalizeMenu(parsed);
    activeCat = MENU.categories[0].key;
    openItemId = null;
    itemConfigState = {};
    document.getElementById("menuMeta").textContent = `目前菜單來源：${MENU.storeName}（自動辨識）`;
    renderTabs(); renderItems();

    try{ await AppStorage.set("dandan_menu", JSON.stringify(parsed)); }catch(e){}

    statusEl.className = "status ok";
    statusEl.textContent = "辨識完成！請核對每個品項的價格是否正確。";
  }catch(e){
    console.error(e);
    statusEl.className = "status err";
    statusEl.textContent = "辨識失敗，請換一張更清楚的菜單照片再試一次。";
  }
}

async function init(){
  let raw = DEFAULT_MENU;
  try{
    const saved = await AppStorage.get("dandan_menu");
    if(saved && saved.value) raw = JSON.parse(saved.value);
  }catch(e){}

  MENU = normalizeMenu(raw);
  activeCat = MENU.categories[0].key;
  document.getElementById("menuMeta").textContent = raw===DEFAULT_MENU
    ? "範例菜單：丹丹漢堡"
    : `目前菜單來源：${MENU.storeName}（自動辨識）`;
  renderTabs();
  renderItems();
  renderCart();
  await loadOrders();

  try{
    const savedName = await AppStorage.get("dandan_last_name");
    if(savedName && savedName.value) document.getElementById("nameInput").value = savedName.value;
  }catch(e){}

  document.getElementById("uploadBtn").onclick = ()=> document.getElementById("fileInput").click();
  document.getElementById("fileInput").onchange = (e)=>{
    const f = e.target.files[0];
    if(f) extractMenuFromImage(f);
    e.target.value = "";
  };
  document.getElementById("resetMenuBtn").onclick = async ()=>{
    const ok = await showConfirm("確定要還原成範例菜單嗎？");
    if(!ok) return;
    MENU = normalizeMenu(DEFAULT_MENU);
    activeCat = MENU.categories[0].key;
    itemConfigState = {}; openItemId = null;
    document.getElementById("menuMeta").textContent = "範例菜單：丹丹漢堡";
    renderTabs(); renderItems();
    try{ await AppStorage.set("dandan_menu", JSON.stringify(DEFAULT_MENU)); }catch(e){}
    document.getElementById("uploadStatus").textContent = "";
  };
  document.getElementById("submitBtn").onclick = submitOrder;
  document.getElementById("refreshBtn").onclick = loadOrders;
  document.getElementById("clearOrdersBtn").onclick = clearAllOrders;
}

init();
</script>
